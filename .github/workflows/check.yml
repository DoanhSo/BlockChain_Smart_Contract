name: Check voting project
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:production
      - run: npm run demo:local
      - uses: actions/upload-artifact@v4
        with:
          name: local-demo-evidence
          path: docs/evidence/local-demo.json
